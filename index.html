<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feliz Primer Año</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="notebook-bg min-h-screen flex flex-col items-center pt-10 pb-8 px-3 select-none overflow-x-hidden text-stone-800">

  <!-- OVERLAY / PANTALLA DE BLOQUEO: CARTA CON CORAZÓN Y PIN -->
  <div id="lockOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 notebook-bg transition-opacity duration-700 ease-out">
    <div class="w-full max-w-xs flex flex-col items-center">
      
      <!-- Cartita flotante con corazón rojo -->
      <div id="envelopeCard" class="envelope-floating relative w-28 h-20 bg-[#F4EBE1] border-2 border-stone-400 rounded-lg shadow-xl flex items-center justify-center mb-6">
        <div class="envelope-flap"></div>
        <div class="relative z-10 w-9 h-9 rounded-full bg-white/90 border border-stone-300 shadow-sm flex items-center justify-center">
          <svg class="w-5 h-5 text-red-500 fill-current animate-pulse" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <!-- Tarjeta del PIN -->
      <div class="w-full bg-[#FFFDF9] rounded-xl p-5 shadow-lg border border-stone-200 text-center relative rotate-[-0.5deg]">
        <div class="washi washi-peach -top-2 left-1/2 -translate-x-1/2"></div>
        
        <h2 class="font-jakarta font-semibold text-stone-800 text-sm tracking-wide mb-4">
          ingresa una fecha especial
        </h2>

        <!-- 6 casillas separadas cada dos por / -->
        <div class="flex items-center justify-center gap-1.5 mb-3">
          <input type="tel" maxlength="1" class="pin-digit" data-idx="0" autofocus inputmode="numeric">
          <input type="tel" maxlength="1" class="pin-digit" data-idx="1" inputmode="numeric">
          <span class="font-bold text-stone-400 text-base px-0.5">/</span>
          <input type="tel" maxlength="1" class="pin-digit" data-idx="2" inputmode="numeric">
          <input type="tel" maxlength="1" class="pin-digit" data-idx="3" inputmode="numeric">
          <span class="font-bold text-stone-400 text-base px-0.5">/</span>
          <input type="tel" maxlength="1" class="pin-digit" data-idx="4" inputmode="numeric">
          <input type="tel" maxlength="1" class="pin-digit" data-idx="5" inputmode="numeric">
        </div>

        <p id="pinFeedback" class="font-jakarta text-xs text-rose-500 font-medium min-h-[18px] transition-all">
          &nbsp;
        </p>
      </div>

    </div>
  </div>

  <!-- TÍTULO EN 2 LÍNEAS -->
  <header class="w-full max-w-sm mb-6 flex flex-col items-center space-y-2.5">
    <div class="flex items-center justify-center gap-1.5 flex-nowrap">
      <span class="paper-letter bg-[#F7C5B8] rotate-[-2deg]">F</span>
      <span class="paper-letter bg-[#FCE5A4] rotate-[3deg]">E</span>
      <span class="paper-letter bg-[#B8D5C8] rotate-[-1deg]">L</span>
      <span class="paper-letter bg-[#BDD8E9] rotate-[2deg]">I</span>
      <span class="paper-letter bg-[#EABCC6] rotate-[-3deg]">Z</span>
    </div>

    <div class="flex items-center justify-center gap-1 flex-nowrap">
      <div class="flex items-center gap-1 flex-nowrap">
        <span class="paper-letter bg-[#D6C7E2] rotate-[1deg]">P</span>
        <span class="paper-letter bg-[#F7C5B8] rotate-[-2deg]">R</span>
        <span class="paper-letter bg-[#FCE5A4] rotate-[2deg]">I</span>
        <span class="paper-letter bg-[#B8D5C8] rotate-[-3deg]">M</span>
        <span class="paper-letter bg-[#BDD8E9] rotate-[1deg]">E</span>
        <span class="paper-letter bg-[#EABCC6] rotate-[-2deg]">R</span>
      </div>

      <div class="w-3.5"></div>

      <div class="flex items-center gap-1 flex-nowrap">
        <span class="paper-letter bg-[#F7C5B8] rotate-[2deg]">A</span>
        <span class="paper-letter bg-[#FCE5A4] rotate-[-1deg]">Ñ</span>
        <span class="paper-letter bg-[#B8D5C8] rotate-[3deg]">O</span>
      </div>
    </div>
  </header>

  <main class="w-full max-w-sm flex flex-col items-center space-y-5">

    <!-- 1. LYRICS -->
    <section class="w-full px-2">
      <div class="bg-[#FFFDF9] rounded-sm p-4 shadow-sm border border-stone-300 relative rotate-[0.3deg] h-[108px] flex items-center justify-center">
        <div class="washi washi-lavender -top-2 left-1/2 -translate-x-1/2"></div>
        <div id="songLyrics" class="font-special not-italic text-stone-700 text-[13px] sm:text-sm leading-relaxed whitespace-pre-line text-center">
          "Cargando letra..."
        </div>
      </div>
    </section>

    <!-- 2. CASSETTE (ESTILO ORIGINAL 2D SCRAPBOOK) -->
    <section class="w-full relative px-6 py-1 flex flex-col items-center">
      
      <button id="prevBtn" aria-label="Anterior" class="absolute left-0 top-1/2 -translate-y-1/2 z-20 w-8 h-8 rounded-full bg-white/90 border border-stone-300 shadow flex items-center justify-center text-stone-600 hover:bg-white active:scale-90 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>

      <button id="nextBtn" aria-label="Siguiente" class="absolute right-0 top-1/2 -translate-y-1/2 z-20 w-8 h-8 rounded-full bg-white/90 border border-stone-300 shadow flex items-center justify-center text-stone-600 hover:bg-white active:scale-90 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>

      <!-- Cassette clásico con bordes nítidos -->
      <div id="swipeArea" class="w-full max-w-[295px] cursor-pointer touch-pan-y">
        <div id="cassetteBody" class="cassette-shell w-full rounded-2xl p-3 shadow-xl border-2 border-stone-700 relative overflow-hidden transition-colors duration-500">
          
          <div class="cassette-screws">
            <span class="screw top-1.5 left-1.5"></span>
            <span class="screw top-1.5 right-1.5"></span>
            <span class="screw bottom-1.5 left-1.5"></span>
            <span class="screw bottom-1.5 right-1.5"></span>
          </div>

          <!-- Etiqueta del Cassette -->
          <div id="cassetteLabel" class="w-full rounded-lg p-2.5 shadow-inner border border-stone-400 relative transition-colors duration-500">
            
            <div class="flex justify-between items-center text-stone-800 text-[11px] font-mono font-bold border-b border-stone-300 pb-1 mb-1.5">
              <span class="px-1.5 py-0.2 rounded bg-white/70 border border-stone-300">LADO A</span>
              <span class="tracking-wider font-semibold text-stone-600">STEREO SM-11</span>
              <span class="text-[9px] text-stone-500">MIXTAPE</span>
            </div>

            <!-- Título y Artista -->
            <div class="text-center px-1">
              <div id="songTitle" class="font-patrick font-bold text-[26px] text-stone-900 leading-tight tracking-tight truncate">Sunflower</div>
              <div id="songArtist" class="font-patrick text-[18px] text-stone-700 leading-none truncate mt-0.5">Harry Styles</div>
            </div>

            <!-- Bobinas y engranajes -->
            <div class="mt-2.5 bg-stone-900/90 rounded-md p-1.5 flex items-center justify-around border-2 border-stone-700 relative shadow-inner">
              
              <div class="w-8 h-8 rounded-full bg-white border border-stone-400 flex items-center justify-center relative shadow">
                <div class="tape-gear w-6 h-6 rounded-full border border-dashed border-stone-600 flex items-center justify-center">
                  <div class="w-2.5 h-2.5 bg-stone-900 rounded-full"></div>
                </div>
              </div>

              <div class="w-16 h-5 bg-amber-950/70 rounded border border-stone-600 flex items-center justify-center overflow-hidden relative">
                <div id="tapeRoll" class="w-full h-1.5 bg-gradient-to-r from-amber-900 via-amber-800 to-amber-950 opacity-90"></div>
                <div id="statusDot" class="absolute w-1.5 h-1.5 rounded-full bg-stone-400"></div>
              </div>

              <div class="w-8 h-8 rounded-full bg-white border border-stone-400 flex items-center justify-center relative shadow">
                <div class="tape-gear w-6 h-6 rounded-full border border-dashed border-stone-600 flex items-center justify-center">
                  <div class="w-2.5 h-2.5 bg-stone-900 rounded-full"></div>
                </div>
              </div>

            </div>

            <!-- Barra de progreso -->
            <div class="w-full bg-stone-300/80 rounded-full h-1 mt-2.5 overflow-hidden">
              <div id="progressBar" class="bg-stone-700 h-full w-0 transition-all duration-200"></div>
            </div>

          </div>

          <div class="w-24 h-2 mx-auto mt-1.5 bg-stone-800/40 rounded-full"></div>
        </div>
      </div>

      <!-- Puntos de carrusel -->
      <div id="carouselDots" class="flex items-center justify-center gap-1.5 mt-3"></div>
    </section>

    <!-- 3. DEDICATORIA -->
    <section class="w-full relative px-2">
      <div class="washi washi-green -top-2 left-6"></div>
      <div class="washi washi-peach -bottom-2 right-6"></div>

      <div class="note-grid p-5 py-6 rounded-sm shadow-md border border-stone-200/80 rotate-[-0.5deg]">
        <p id="noteText" class="font-jakarta text-[14px] sm:text-[15px] text-stone-700 font-normal leading-relaxed text-center min-h-[58px] flex items-center justify-center tracking-normal">
          Cargando tu nota...
        </p>
      </div>
    </section>

    <!-- 4. BOTÓN SPOTIFY -->
    <section class="w-full px-2 pt-1 flex justify-center">
      <a id="spotifyLink" href="#" target="_blank" rel="noopener noreferrer" 
         class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#1DB954] hover:bg-[#1aa34a] text-white font-mono text-xs uppercase tracking-wider font-bold rounded-full shadow-md transition active:scale-95">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        <span>Abrir en Spotify</span>
      </a>
    </section>

  </main>

  <!-- 5. PIE DE NOTA -->
  <footer class="mt-8 text-center">
    <p class="font-jakarta text-xs text-stone-600/80 tracking-wide font-medium">
      con amor, maju
    </p>
  </footer>

  <audio id="audioPlayer" preload="auto"></audio>

  <script src="js/songs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
